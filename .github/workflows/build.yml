name: build

# Produces the artifacts the README documents — deb, AppImage, and an arm64 APK
# — on a runner that has the JDK, Android SDK and NDK a desktop checkout usually
# does not.
#
# The APK is signed with the debug key, exactly as android/app/build.gradle.kts
# already does. It is a test build, not a distributable one; see "Known gaps".

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "stable": a floating SDK turns an unrelated upstream
  # release into a red build. pubspec asks for >=3.47.0.
  FLUTTER_VERSION: 3.47.2
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  # Must match the default in scripts/build-libbox.sh — it is also the cache key.
  SINGBOX_TAG: v1.13.19

jobs:
  verify:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-x64-test

      - name: Install Flutter
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME"
            rm -f /tmp/flutter.tar.xz
          fi
          git config --global --add safe.directory "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # VISUAL_SNAPSHOTS stays unset on purpose: those goldens were recorded on
      # a developer's font stack and mean nothing on a runner.
      - run: flutter test

  package:
    name: deb + AppImage + APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release step, on tags only
    steps:
      - uses: actions/checkout@v4

      # clang/cmake/ninja/gtk: Flutter's Linux desktop toolchain. librsvg2-bin
      # gives scripts/package.sh rsvg-convert for the icon set;
      # desktop-file-utils gives appimagetool desktop-file-validate.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            librsvg2-bin desktop-file-utils

      # JDK 17 exactly: scripts/build-libbox.sh rejects any other release,
      # because gomobile's generated Java targets it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ~22 MB and ~15 minutes to build, and it only changes when SINGBOX_TAG or
      # the build flags do — hence the script hash in the key.
      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_TAG }}-arm64-${{ hashFiles('scripts/build-libbox.sh') }}

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: '1.25'
          cache: false

      # ANDROID_HOME and ANDROID_NDK_HOME come preset on the runner image, so the
      # NDK version floats with it; pin ANDROID_NDK_HOME here if that ever bites.
      - name: Build libbox.aar
        if: steps.libbox.outputs.cache-hit != 'true'
        run: scripts/build-libbox.sh

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-x64-desktop

      - name: Install Flutter
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            tar -xJf /tmp/flutter.tar.xz -C "$HOME"
            rm -f /tmp/flutter.tar.xz
          fi
          git config --global --add safe.directory "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter --version

      # appimagetool has no apt package, and this workflow does not pick a
      # download source for you. To get an AppImage out of CI, set the
      # APPIMAGETOOL_URL repository variable (Settings -> Secrets and variables
      # -> Actions -> Variables) to a build you trust, and APPIMAGETOOL_SHA256
      # to its digest. Left unset, the AppImage is skipped and the deb and APK
      # are still produced.
      - name: Fetch appimagetool
        if: vars.APPIMAGETOOL_URL != ''
        env:
          APPIMAGETOOL_URL: ${{ vars.APPIMAGETOOL_URL }}
          APPIMAGETOOL_SHA256: ${{ vars.APPIMAGETOOL_SHA256 }}
        run: |
          curl -fsSL -o /tmp/appimagetool "$APPIMAGETOOL_URL"
          sha256sum /tmp/appimagetool
          if [ -n "$APPIMAGETOOL_SHA256" ]; then
            echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          else
            echo "::warning::APPIMAGETOOL_SHA256 unset, the download was not verified"
          fi
          chmod +x /tmp/appimagetool
          echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"

      # Runners have no FUSE, so appimagetool has to unpack itself to run;
      # scripts/package.sh already passes --appimage-extract-and-run.
      - name: Package
        run: scripts/package.sh

      # package.sh skips an artifact rather than failing when a tool is missing,
      # which is right locally and wrong here.
      - name: Check the artifacts exist
        env:
          WANT_APPIMAGE: ${{ vars.APPIMAGETOOL_URL != '' }}
        run: |
          ls -l dist
          fail=0
          have() { compgen -G "$1" >/dev/null || { echo "missing: $1"; fail=1; }; }
          have 'dist/*.deb'
          have 'dist/*.apk'
          if [ "$WANT_APPIMAGE" = true ]; then have 'dist/*.AppImage'; fi
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: singbox-client-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
