name: singbox_client
description: A premium cross-platform sing-box client UI starter.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.5.0
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Routing rule-sets. Bundled rather than downloaded because sing-box treats
    # a failed `remote` rule-set fetch as fatal at start — see
    # lib/data/rule_sets.dart. Refresh with scripts/fetch-rule-sets.sh.
    - assets/rule-sets/
    # Tray icons, read at runtime by tray_manager (see scripts/build-icons.sh).
    - assets/tray/

  fonts:
    # Variable fonts: one file covers the whole weight range.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    # Static faces: only the two weights monoStyle() actually asks for, to keep
    # the bundle down. JetBrains Mono has no CJK glyphs, so mono styles keep
    # AppFonts.cjkFallback attached.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
